<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>ZEPHYR - الرئيسية</title>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, onSnapshot, limit, startAfter, getDoc, where, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-stk7sia-kJ_PzVMuSI5gmyqR5yTtR_A",
            authDomain: "zephyr-8df18.firebaseapp.com",
            projectId: "zephyr-8df18",
            storageBucket: "zephyr-8df18.firebasestorage.app",
            messagingSenderId: "836989543748",
            appId: "1:836989543748:web:fc07d9e4a79172482ce311"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.ZephyrApp = {
            auth, db, onAuthStateChanged, signOut,
            collection, addDoc, getDocs, query, orderBy, serverTimestamp,
            doc, updateDoc, arrayUnion, arrayRemove, onSnapshot,
            limit, startAfter, getDoc, where, deleteDoc, increment
        };
    </script>

    <style>
        /* ... نفس الأنماط السابقة ... */
        /* تم إزالة الأنماط للاختصار، لكن سيتم تضمينها كاملة في الملف النهائي */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

        :root {
            --bg-main: #0a0a0f;
            --bg-card: rgba(10, 10, 20, 0.88);
            --bg-input: rgba(0, 0, 0, 0.8);
            --primary: #00e5ff;
            --primary-hover: #00b8d4;
            --primary-glow: rgba(0, 229, 255, 0.55);
            --accent: #ff00e5;
            --accent-glow: rgba(255, 0, 229, 0.45);
            --gold: #ffcc00;
            --text-main: #f0f8ff;
            --text-muted: #a0b0c0;
            --border-color: rgba(0, 229, 255, 0.32);
            --danger: #ef4444;
            --success: #10b981;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --radius-pill: 999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --glow-soft: 0 0 18px var(--primary-glow);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font-body); min-width: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 229, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 12% 15%, rgba(0, 229, 255, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 88% 85%, rgba(255, 0, 229, 0.09) 0%, transparent 45%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .app-layout { width: 100%; max-width: 800px; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

        /* ===== HEADER ===== */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(18px); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; color: #08080d;
            box-shadow: 0 0 20px var(--primary-glow);
            border: 1px solid rgba(255,255,255,0.15);
            transform: rotate(-3deg); transition: var(--transition);
        }
        .brand-logo:hover { transform: rotate(0deg) scale(1.05); }
        .brand-title {
            font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; letter-spacing: 2px;
            background: linear-gradient(to right, #00e5ff, #ff00e5, #ffcc00, #00e5ff);
            background-size: 300% 100%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientShift 5s ease-in-out infinite alternate;
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .icon-link {
            display: flex; align-items: center; justify-content: center; position: relative;
            width: 34px; height: 34px; border-radius: 50%;
            color: var(--text-muted); text-decoration: none; background: transparent; border: none;
            cursor: pointer; transition: var(--transition); flex-shrink: 0;
        }
        .icon-link:hover { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        .icon-link svg { width: 22px; height: 22px; }
        .notif-dot {
            position: absolute; top: 3px; left: 3px; width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); display: none;
        }
        .notif-dot.show { display: block; }
        .user-avatar-btn {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.85rem; color: #08080d; border: none;
            box-shadow: 0 0 10px var(--primary-glow); transition: var(--transition);
        }
        .user-avatar-btn:hover { transform: scale(1.06); }

        .main-container { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 16px; max-width: 620px; margin: 0 auto; padding-bottom: 90px; width: 100%; }

        /* ===== STORIES ===== */
        .stories-section {
            display: flex; gap: 12px; overflow-x: auto; padding: 12px 10px;
            scrollbar-width: none; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
        }
        .stories-section::-webkit-scrollbar { display: none; }
        .story-card { flex: 0 0 66px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: var(--transition); background: none; border: none; }
        .story-card:hover { transform: translateY(-3px); }
        .story-ring {
            width: 58px; height: 58px; border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--gold));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 16px var(--primary-glow);
        }
        .story-ring.seen { background: rgba(255,255,255,0.12); box-shadow: none; }
        .story-avatar-container {
            width: 100%; height: 100%; border-radius: 50%;
            background: var(--bg-main); border: 2px solid var(--bg-main);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.8rem; overflow: hidden; color: var(--text-main);
        }
        .story-avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .story-name { font-size: 0.6rem; color: var(--text-muted); text-align: center; max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ===== CREATE POST ===== */
        .create-post-card, .post-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 14px; backdrop-filter: blur(12px);
            transition: var(--transition); position: relative; overflow: hidden;
        }
        .create-post-card::before, .post-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--gold), var(--primary));
            opacity: 0; transition: var(--transition);
        }
        .post-card:hover::before { opacity: 1; }
        .post-card:hover { border-color: var(--primary); box-shadow: 0 10px 40px rgba(0, 229, 255, 0.12); }
        .post-textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px; color: var(--text-main); resize: none; min-height: 64px; outline: none; font-size: 0.95rem; }
        .post-textarea:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(0,229,255,0.2); }

        /* ===== POST HEADER ===== */
        .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
        .post-author { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1rem; color: #08080d; box-shadow: 0 0 10px var(--primary-glow);
        }
        .author-info { min-width: 0; }
        .author-name-row { display: flex; align-items: center; gap: 6px; }
        .author-name { font-weight: 700; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .author-badge { font-size: 0.58rem; background: rgba(0,229,255,0.15); color: var(--primary); padding: 2px 7px; border-radius: 20px; border: 1px solid rgba(0,229,255,0.3); flex-shrink: 0; }
        .post-time { font-size: 0.68rem; color: var(--text-muted); display: block; margin-top: 1px; }
        .btn-follow-mini {
            font-size: 0.7rem; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-pill);
            background: linear-gradient(135deg, var(--primary), var(--accent)); color: #08080d; border: none;
            cursor: pointer; flex-shrink: 0; transition: var(--transition);
        }
        .btn-follow-mini.following { background: rgba(255,255,255,0.06); color: var(--text-muted); border: 1px solid var(--border-color); }
        .post-menu-wrap { position: relative; flex-shrink: 0; }
        .btn-post-menu { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; display: flex; }
        .btn-post-menu:hover { color: var(--text-main); }
        .btn-post-menu svg { width: 20px; height: 20px; }
        .post-menu-dropdown {
            display: none; position: absolute; top: 30px; left: 0; z-index: 20;
            background: #120c1e; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            min-width: 160px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); overflow: hidden;
        }
        .post-menu-dropdown.show { display: block; }
        .post-menu-dropdown button {
            width: 100%; text-align: right; background: none; border: none; color: var(--text-main);
            padding: 10px 14px; font-size: 0.82rem; cursor: pointer; display: block; font-family: var(--font-body);
        }
        .post-menu-dropdown button:hover { background: rgba(255,255,255,0.06); }
        .post-menu-dropdown button.danger { color: #fca5a5; }

        .post-body { font-size: 0.92rem; line-height: 1.6; margin-bottom: 10px; word-break: break-word; white-space: pre-wrap; }
        .post-body .author-name-inline { font-weight: 700; margin-left: 6px; }

        /* ===== POST IMAGE + DOUBLE TAP HEART ===== */
        .post-image-container { position: relative; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 10px; max-height: 460px; display: flex; align-items: center; justify-content: center; background: #000; cursor: pointer; }
        .post-image-container img { width: 100%; height: auto; max-height: 460px; object-fit: contain; display: block; }
        .dbl-tap-heart {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 90px; height: 90px; fill: #fff; filter: drop-shadow(0 0 18px var(--accent-glow));
            pointer-events: none; opacity: 0;
        }
        .dbl-tap-heart.burst { animation: heartBurst 0.75s ease; }
        @keyframes heartBurst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
            45% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* ===== POST FOOTER / ACTIONS ===== */
        .post-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); }
        .post-actions-left { display: flex; align-items: center; gap: 4px; }
        .action-btn {
            background: none; border: none; color: var(--text-main);
            cursor: pointer; display: flex; align-items: center; gap: 5px;
            font-size: 0.78rem; padding: 6px 8px; border-radius: var(--radius-pill);
            transition: var(--transition);
        }
        .action-btn:hover { background: rgba(255,255,255,0.05); }
        .action-btn.liked { color: var(--accent); }
        .action-btn.liked svg { fill: var(--accent); filter: drop-shadow(0 0 6px var(--accent-glow)); }
        .action-btn.saved { color: var(--primary); }
        .action-btn.saved svg { fill: var(--primary); }
        .action-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0; }
        .action-btn.liked svg, .action-btn.saved svg { stroke: none; }

        .likes-line { font-size: 0.82rem; font-weight: 700; margin: 6px 0 4px; }
        .view-comments-link { font-size: 0.78rem; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 4px; display: block; }
        .view-comments-link:hover { color: var(--text-main); }

        /* ===== CREATE POST EXTRAS ===== */
        .post-image-preview img { display: block; }
        .remove-img { display: flex; align-items: center; justify-content: center; line-height: 1; font-size: 0.7rem; }
        .upload-progress-container { display: none; margin-top: 10px; }
        .upload-progress-container.active { display: block; }
        .upload-progress-bar { width: 100%; height: 8px; border-radius: 20px; overflow: hidden; background: rgba(255,255,255,0.08); }
        .upload-progress-fill { height: 100%; width: 0%; border-radius: 20px; transition: width 0.2s ease; }
        .upload-progress-text { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; text-align: center; }
        .btn-cancel-publish { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); border-radius: var(--radius-pill); padding: 6px 16px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: var(--transition); }
        .btn-cancel-publish:hover { background: rgba(239,68,68,0.2); }

        .load-more-btn { background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); padding: 12px; border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; transition: var(--transition); }
        .load-more-btn:hover { color: var(--primary); border-color: var(--primary); box-shadow: var(--glow-soft); }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 800px;
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(18px);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; padding: 6px 0 12px; z-index: 100; transition: var(--transition);
        }
        .bottom-nav.hidden { transform: translateX(-50%) translateY(100%); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-muted); text-decoration: none; font-size: 0.6rem; padding: 4px 12px; border-radius: 12px; transition: var(--transition); }
        .nav-item.active, .nav-item:hover { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }

        /* ===== MODALS ===== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: var(--transition); padding: 20px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #120c1e; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .modal-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; margin-bottom: 10px; }
        .modal-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-modal { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: none; font-weight: 700; cursor: pointer; transition: var(--transition); font-family: var(--font-body); }
        .btn-cancel { background: rgba(255,255,255,0.08); color: var(--text-main); }
        .btn-cancel:hover { background: rgba(255,255,255,0.15); }
        .btn-confirm-logout, .btn-confirm-danger { background: var(--danger); color: #fff; }
        .btn-confirm-logout:hover, .btn-confirm-danger:hover { filter: brightness(1.1); }

        /* ===== COMMENTS MODAL ===== */
        .comments-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(14px); z-index: 500; display: none; justify-content: center; align-items: center; padding: 20px; }
        .comments-modal.show { display: flex; }
        .comments-box { background: #120c1e; border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 480px; max-height: 85vh; display: flex; flex-direction: column; padding: 18px; }
        .comments-header { font-weight: 700; }
        .comments-list { flex: 1; overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column; gap: 12px; min-height: 120px; }
        .comment-item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius-sm); padding: 8px 12px; }
        .comment-user { font-weight: 700; font-size: 0.8rem; color: var(--primary); flex-shrink: 0; }
        .comment-text { font-size: 0.85rem; flex: 1 1 auto; min-width: 60%; word-break: break-word; }
        .comment-time { font-size: 0.65rem; color: var(--text-muted); flex-basis: 100%; }
        .comments-input-area { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
        .comments-input-area input { flex: 1; min-width: 0; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 50px; padding: 10px 16px; color: var(--text-main); outline: none; }
        .comments-input-area button { background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; color: #08080d; padding: 10px 20px; border-radius: 50px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
        .comments-input-area button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== STORY CREATE / VIEWER ===== */
        .story-create-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(14px); z-index: 600; display: none; align-items: center; justify-content: center; padding: 20px; }
        .story-create-modal.active { display: flex; }
        .story-create-box { background: #120c1e; border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 380px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .story-create-box h3 { font-family: var(--font-display); font-size: 1rem; text-align: center; }
        .story-textarea { width: 100%; min-height: 90px; resize: vertical; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px; color: var(--text-main); outline: none; }
        .story-image-preview { display: none; position: relative; width: 100%; height: 160px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-color); }
        .story-image-preview.active { display: block; }
        .story-image-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #storyProgressModal { z-index: 650; }

        .story-viewer-modal { position: fixed; inset: 0; background: #000; z-index: 400; display: none; flex-direction: column; }
        .story-viewer-modal.active { display: flex; }
        .story-progress-container { display: flex; gap: 4px; padding: 12px 16px 0; z-index: 10; }
        .story-progress-segment { flex: 1; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
        .story-progress-fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; transition: width 0.1s linear; }
        .story-viewer-header { display: flex; justify-content: space-between; padding: 12px 16px; z-index: 10; align-items: center; }
        .story-viewer-user { display: flex; align-items: center; gap: 10px; }
        .story-viewer-meta { display: flex; flex-direction: column; line-height: 1.2; }
        .story-viewer-name { font-weight: 700; font-size: 0.9rem; }
        .story-viewer-time { font-size: 0.65rem; color: var(--text-muted); }
        .story-close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 4px; }
        .story-viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; background: #0a0a0a; position: relative; }
        .story-viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .story-viewer-caption { position: absolute; bottom: 40px; left: 20px; right: 20px; text-align: center; color: #fff; background: rgba(0,0,0,0.6); padding: 10px; border-radius: var(--radius-sm); backdrop-filter: blur(6px); z-index: 6; }
        .story-tap-areas { position: absolute; inset: 0; display: flex; z-index: 5; }
        .story-tap-left, .story-tap-right { flex: 1; cursor: pointer; }

        .btn-publish { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #08080d; border: none; padding: 8px 22px; border-radius: var(--radius-pill); font-weight: 700; cursor: pointer; transition: var(--transition); box-shadow: var(--glow-soft); }
        .btn-publish:active { transform: scale(0.95); }
        .btn-publish:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .alert-box { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 12px; display: none; }
        .alert-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; }
        .toast {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #120c1e; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 10px 18px; border-radius: var(--radius-pill); font-size: 0.8rem; font-weight: 600;
            z-index: 900; opacity: 0; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 480px) {
            .header { padding: 8px 12px; }
            .brand-title { font-size: 0.95rem; }
            .brand-logo { width: 30px; height: 30px; font-size: 1rem; }
            .main-container { padding: 8px; gap: 12px; padding-bottom: 80px; }
            .post-card { padding: 12px; }
            .post-body { font-size: 0.85rem; }
            .post-image-container { max-height: 260px; }
            .comments-box { max-height: 90vh; }
            .story-viewer-caption { bottom: 30px; left: 12px; right: 12px; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- الهيدر -->
        <header class="header">

            <div class="header-actions">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
                    <span class="notif-dot" id="notifDot"></span>
                </button>
                <a href="chat.html" class="icon-link" title="الدردشة">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path></svg>
                </a>
                <a href="settings.html" class="icon-link" title="الإعدادات">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </a>
                <button type="button" class="user-avatar-btn" id="headerAvatar" title="تسجيل الخروج">G</button>
            </div>
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="main-container">
            <div class="stories-section" id="storiesSection"></div>

            <div class="alert-box alert-danger" id="feedAlert"></div>

            <div class="create-post-card">
                <div class="post-input-wrapper" style="display:flex;gap:12px;align-items:flex-start;">
                    <div class="user-avatar" id="inputAvatar">G</div>
                    <textarea id="postContent" class="post-textarea" placeholder="شارك أفكارك..."></textarea>
                </div>
                <div style="display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap;">
                    <label for="postImageInput" style="background:rgba(255,255,255,0.05);border:1px dashed var(--border-color);padding:6px 14px;border-radius:var(--radius-sm);font-size:0.8rem;color:var(--text-muted);cursor:pointer;">📷 صورة</label>
                    <input type="file" id="postImageInput" accept="image/*" style="display:none;" onchange="previewPostImage(this)">
                    <div class="post-image-preview" id="postImagePreview" style="display:none;position:relative;width:60px;height:60px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-color);"><img id="postImagePreviewImg" style="width:100%;height:100%;object-fit:cover;"><button class="remove-img" onclick="removePostImage()" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.7);border:none;color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;">✕</button></div>
                </div>
                <div class="upload-progress-container" id="uploadProgressContainer">
                    <div class="upload-progress-bar"><div class="upload-progress-fill" id="uploadProgressFill" style="background: linear-gradient(90deg, var(--primary), var(--accent));"></div></div>
                    <div class="upload-progress-text" id="uploadProgressText">0%</div>
                </div>
                <div class="create-post-actions" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.05);gap:10px;">
                    <span style="font-size:0.7rem;color:var(--text-muted);">🎮 ZEPHYR</span>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button class="btn-cancel-publish" id="cancelPublishBtn" style="display:none;" onclick="cancelPublish()">إلغاء</button>
                        <button class="btn-publish" id="publishBtn" onclick="submitPost()">نشر الآن</button>

            <div class="feed-container" id="feedContainer" style="display:flex;flex-direction:column;gap:16px;"></div>

        <nav class="bottom-nav" id="bottomNav">
            <a href="index.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>الرئيسية</span></a>

            <a href="chat.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span>الدردشة</span></a>
            <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 4 2 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>الملف</span></a>
        </nav>
    </div>

    <!-- مودال إنشاء ستوري -->
    <div class="story-create-modal" id="storyCreateModal">
        <div class="story-create-box">
            <h3>📸 إنشاء ستوري</h3>
            <textarea id="storyTextInput" class="story-textarea" placeholder="اكتب ستوري نصية... (اختياري)"></textarea>
            <input type="file" id="storyImageInput" accept="image/*" style="display:none;" onchange="previewStoryImage(this)">
            <button class="btn-publish" style="background:rgba(255,255,255,0.08);box-shadow:none;color:var(--text-main);" onclick="document.getElementById('storyImageInput').click()">📷 إضافة صورة</button>
            <div class="story-image-preview" id="storyImagePreview">
                <img id="storyImagePreviewImg" src="" alt="معاينة">
                <button class="remove-img" style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;" onclick="removeStoryImage()">✕</button>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="btn-publish" style="flex:1;" onclick="publishStory()">🚀 نشر</button>
                <button class="btn-publish" style="flex:1;background:rgba(255,255,255,0.1);box-shadow:none;color:var(--text-main);" onclick="closeStoryCreateModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- مودال تقدم نشر الستوري -->
    <div class="modal-overlay" id="storyProgressModal">
        <div class="modal-box" style="max-width: 300px;">
            <div class="modal-title">⏳ جاري نشر الستوري...</div>
            <div style="margin: 15px 0;">
                <div class="upload-progress-bar"><div id="storyProgressFill" class="upload-progress-fill" style="background: linear-gradient(90deg, var(--primary), var(--accent));"></div></div>
                <div id="storyProgressText" class="upload-progress-text">0%</div>
            </div>
        </div>
    </div>

    <!-- مودال تسجيل الخروج -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-box">
            <div class="modal-title">تسجيل الخروج</div>
            <div class="modal-desc">هل أنت متأكد من أنك تريد تسجيل الخروج؟</div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeLogoutModal()">إلغاء</button>
                <button class="btn-modal btn-confirm-logout" onclick="confirmSignOut()">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <!-- مودال تأكيد حذف منشور -->
    <div class="modal-overlay" id="deletePostModal">
        <div class="modal-box">
            <div class="modal-title">حذف المنشور</div>
            <div class="modal-desc">هل أنت متأكد من حذف هذا المنشور؟ لا يمكن التراجع عن هذا الإجراء.</div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeDeleteModal()">إلغاء</button>
                <button class="btn-modal btn-confirm-danger" onclick="confirmDeletePost()">حذف</button>
            </div>
        </div>
    </div>

    <!-- مودال التعليقات -->
    <div class="comments-modal" id="commentsModal">
        <div class="comments-box">
            <div class="comments-header" style="display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border-color);">
                <span>💬 التعليقات</span>
                <span class="close-btn" onclick="closeCommentsModal()" style="cursor:pointer;font-size:1.1rem;">✕</span>
            </div>
            <div class="comments-list" id="commentsList"></div>
            <div class="comments-input-area">
                <input type="text" id="commentInput" placeholder="تعليق..." onkeydown="if(event.key==='Enter'){sendComment();}">
                <button id="sendCommentBtn" onclick="sendComment()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- عارض الستوري -->
    <div class="story-viewer-modal" id="storyViewerModal">
        <div class="story-progress-container" id="storyProgressContainer"></div>
        <div class="story-viewer-header">
            <div class="story-viewer-user">
                <div class="user-avatar" id="viewerAvatar">?</div>
                <div class="story-viewer-meta">
                    <span class="story-viewer-name" id="viewerUsername">اسم</span>
                    <span class="story-viewer-time" id="viewerTime"></span>
                </div>
            </div>
            <button class="story-close-btn" onclick="closeStoryViewer()">✕</button>
        </div>
        <div class="story-viewer-body">
            <img id="viewerImage" src="" style="display:none;">
            <div class="story-viewer-caption" id="viewerCaption" style="display:none;"></div>
            <div class="story-tap-areas"><div class="story-tap-left" onclick="previousStorySegment()"></div><div class="story-tap-right" onclick="nextStorySegment()"></div></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ====== إعدادات Cloudinary ======
        const CLOUD_NAME = "k6juyzsw";
        const UPLOAD_PRESET = "zephyr_preset";

        // ====== دالة التعقيم ======
        function sanitize(str) {
            if (typeof str !== 'string') return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#x2F;', '`': '&#x60;', '=': '&#x3D;' };
            return str.replace(/[&<>"'`=\/]/g, (m) => map[m]);
        }

        // ====== المتغيرات العامة ======
        let currentUser = null;
        let isSigningOut = false;
        let lastDoc = null;
        let hasMore = true;
        let isFetching = false;
        let unsubscribePosts = null;
        let unsubscribeComments = null;
        let activePostId = null;
        let pendingDeletePostId = null;
        let imageFile = null;
        let userFollowing = [];
        let userSaved = [];
        let isPublishing = false;
        let openMenuPostId = null;

        let groupedStories = {};
        let activeStoryUserIds = [];
        let currentStoryUserIndex = 0;
        let currentStoryItemIndex = 0;
        let storyTimer = null;
        let storyImageFile = null;

        // ====== التنبيهات ======
        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('feedAlert');
            box.textContent = sanitize(msg);
            box.style.display = 'block';
            box.className = isSuccess ? 'alert-box alert-success' : 'alert-box alert-danger';
            clearTimeout(window.alertTimer);
            window.alertTimer = setTimeout(() => { box.style.display = 'none'; }, 5000);
        }
        function hideAlert() { document.getElementById('feedAlert').style.display = 'none'; clearTimeout(window.alertTimer); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = sanitize(msg);
            t.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }
        function showNotifPlaceholder() { showToast('لا توجد إشعارات جديدة الآن'); }

        // ====== تسجيل الخروج ======
        document.getElementById('headerAvatar').addEventListener('click', () => {
            document.getElementById('logoutModal').classList.add('active');
        });
        function closeLogoutModal() { document.getElementById('logoutModal').classList.remove('active'); }
        async function confirmSignOut() {
            if (isSigningOut) return;
            isSigningOut = true;
            try {
                await window.ZephyrApp.signOut(window.ZephyrApp.auth);
                window.location.replace('login.html');
            } catch (e) {
                console.error('خطأ:', e);
                showAlert('حدث خطأ أثناء تسجيل الخروج.');
                closeLogoutModal();
                isSigningOut = false;
            }
        }

        // ====== إعداد الملف الشخصي ======
        function setupUserProfile(user) {
            const name = user.displayName || (user.email ? user.email.split('@')[0] : null) || 'Gamer';
            const initial = name.charAt(0).toUpperCase();
            document.getElementById('headerAvatar').textContent = sanitize(initial);
            document.getElementById('inputAvatar').textContent = sanitize(initial);
        }

        // ====== تحميل المتابعين والمحفوظات ======
        async function loadFollowing() {
            try {
                const { db, doc, getDoc } = window.ZephyrApp;
                const userDoc = await getDoc(doc(db, "users", currentUser.uid));
                if (userDoc.exists()) {
                    userFollowing = userDoc.data().following || [];
                    userSaved = userDoc.data().savedPosts || [];
                }
            } catch (e) {
                console.error("خطأ تحميل بيانات المستخدم:", e);
            }
        }

        // ====== المتابعة (مع تحديث الأعداد) ======
        async function toggleFollow(authorUid, btnEl) {
            if (!currentUser) { showAlert('يجب تسجيل الدخول للمتابعة.'); return; }
            if (!authorUid || authorUid === currentUser.uid) return;
            const isFollowing = userFollowing.includes(authorUid);
            btnEl.disabled = true;
            try {
                const { db, doc, updateDoc, arrayUnion, arrayRemove, increment } = window.ZephyrApp;
                const myRef = doc(db, "users", currentUser.uid);
                const targetRef = doc(db, "users", authorUid);
                if (isFollowing) {
                    await updateDoc(myRef, { following: arrayRemove(authorUid), followingCount: increment(-1) });
                    await updateDoc(targetRef, { followers: arrayRemove(currentUser.uid), followersCount: increment(-1) });
                    userFollowing = userFollowing.filter(id => id !== authorUid);
                } else {
                    await updateDoc(myRef, { following: arrayUnion(authorUid), followingCount: increment(1) });
                    await updateDoc(targetRef, { followers: arrayUnion(currentUser.uid), followersCount: increment(1) });
                    userFollowing.push(authorUid);
                }
                document.querySelectorAll(`.btn-follow-mini[data-uid="${authorUid}"]`).forEach(b => {
                    const nowFollowing = userFollowing.includes(authorUid);
                    b.textContent = nowFollowing ? 'متابَع' : 'متابعة';
                    b.classList.toggle('following', nowFollowing);
                });
            } catch (e) {
                console.error('خطأ المتابعة:', e);
                showToast('تعذر تحديث حالة المتابعة');
            } finally {
                btnEl.disabled = false;
            }
        }

        // ====== الحفظ ======
        async function toggleSavePost(postId, btnEl) {
            if (!currentUser) { showAlert('يجب تسجيل الدخول للحفظ.'); return; }
            const isSaved = userSaved.includes(postId);
            try {
                const { db, doc, updateDoc, arrayUnion, arrayRemove } = window.ZephyrApp;
                const myRef = doc(db, "users", currentUser.uid);
                if (isSaved) {
                    await updateDoc(myRef, { savedPosts: arrayRemove(postId) });
                    userSaved = userSaved.filter(id => id !== postId);
                    showToast('تم إزالة المنشور من المحفوظات');
                } else {
                    await updateDoc(myRef, { savedPosts: arrayUnion(postId) });
                    userSaved.push(postId);
                    showToast('تم حفظ المنشور');
                }
                document.querySelectorAll(`.action-btn.save-btn[data-post-id="${postId}"]`).forEach(b => {
                    b.classList.toggle('saved', userSaved.includes(postId));
                });
            } catch (e) {
                console.error('خطأ الحفظ:', e);
                showToast('تعذر تحديث الحفظ');
            }
        }

        // ====== قائمة خيارات المنشور ======
        function togglePostMenu(postId) {
            document.querySelectorAll('.post-menu-dropdown').forEach(el => {
                if (el.dataset.postId !== postId) el.classList.remove('show');
            });
            const menu = document.querySelector(`.post-menu-dropdown[data-post-id="${postId}"]`);
            if (!menu) return;
            menu.classList.toggle('show');
            openMenuPostId = menu.classList.contains('show') ? postId : null;
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.post-menu-wrap')) {
                document.querySelectorAll('.post-menu-dropdown').forEach(el => el.classList.remove('show'));
                openMenuPostId = null;
            }
        });
        function copyPostLink(postId) {
            const url = `${window.location.origin}${window.location.pathname.replace('index.html','')}index.html#post-${postId}`;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => showToast('تم نسخ رابط المنشور')).catch(() => showToast('تعذر نسخ الرابط'));
            } else { showToast('تعذر نسخ الرابط'); }
            togglePostMenu(postId);
        }
        function reportPost(postId) { showToast('تم إرسال البلاغ، شكراً لك'); togglePostMenu(postId); }
        function openDeleteModal(postId) {
            pendingDeletePostId = postId;
            togglePostMenu(postId);
            document.getElementById('deletePostModal').classList.add('active');
        }
        function closeDeleteModal() { pendingDeletePostId = null; document.getElementById('deletePostModal').classList.remove('active'); }
        async function confirmDeletePost() {
            if (!pendingDeletePostId) return;
            const postId = pendingDeletePostId;
            try {
                const { db, doc, deleteDoc } = window.ZephyrApp;
                await deleteDoc(doc(db, "posts", postId));
                showToast('تم حذف المنشور');
            } catch (e) {
                console.error('خطأ الحذف:', e);
                showAlert('تعذر حذف المنشور.');
            } finally {
                closeDeleteModal();
            }
        }

        // ====== نظام الستوريز ======
        async function fetchStories() {
            try {
                const { db, collection, query, where, getDocs } = window.ZephyrApp;
                const nowIso = new Date().toISOString();
                const q = query(collection(db, "stories"), where("expiresAt", ">", nowIso));
                const snapshot = await getDocs(q);
                groupedStories = {};
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const uid = data.userId;
                    if (!groupedStories[uid]) groupedStories[uid] = [];
                    groupedStories[uid].push({ id: docSnap.id, ...data });
                });
                Object.keys(groupedStories).forEach(uid => {
                    groupedStories[uid].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                });
                await renderStoriesBar();
            } catch (err) {
                console.error("خطأ في جلب الستوريز:", err);
            }
        }

        async function renderStoriesBar() {
            const container = document.getElementById('storiesSection');
            const myUid = currentUser ? currentUser.uid : null;

            let html = `
                <button type="button" class="story-card" onclick="openStoryCreateModal()">
                    <div class="story-ring" style="background: rgba(255,255,255,0.15); box-shadow: none;">
                        <div class="story-avatar-container" style="font-size: 24px;">+</div>
                    </div>
                    <span class="story-name">إنشاء</span>
                </button>
            `;

            activeStoryUserIds = [];

            if (groupedStories[myUid] && groupedStories[myUid].length > 0) {
                activeStoryUserIds.push(myUid);
                const myStories = groupedStories[myUid];
                const latest = myStories[myStories.length - 1];
                html += `
                    <button type="button" class="story-card" onclick="openStoryViewerForUser('${myUid}')">
                        <div class="story-ring">
                            <div class="story-avatar-container">
                                ${latest.imageUrl ? `<img src="${latest.imageUrl}" alt="قصتي">` : '📝'}
                            </div>
                        </div>
                        <span class="story-name">قصتي</span>
                    </button>
                `;
            }

            const otherUids = Object.keys(groupedStories).filter(uid => uid !== myUid);
            for (const uid of otherUids) {
                activeStoryUserIds.push(uid);
                const stories = groupedStories[uid];
                if (!stories || stories.length === 0) continue;
                const latest = stories[stories.length - 1];
                let displayName = "جيمر";
                try {
                    const { db, doc, getDoc } = window.ZephyrApp;
                    const userDoc = await getDoc(doc(db, "users", uid));
                    if (userDoc.exists()) displayName = userDoc.data().displayName || "جيمر";
                } catch(e) {}
                html += `
                    <button type="button" class="story-card" onclick="openStoryViewerForUser('${uid}')">
                        <div class="story-ring">
                            <div class="story-avatar-container">
                                ${latest.imageUrl ? `<img src="${latest.imageUrl}" alt="${sanitize(displayName)}">` : sanitize(displayName.charAt(0))}
                            </div>
                        </div>
                        <span class="story-name">${sanitize(displayName)}</span>
                    </button>
                `;
            }

            container.innerHTML = html;
        }

        function openStoryCreateModal() {
            document.getElementById('storyCreateModal').classList.add('active');
            document.getElementById('storyTextInput').value = '';
            removeStoryImage();
        }
        function closeStoryCreateModal() { document.getElementById('storyCreateModal').classList.remove('active'); }
        function previewStoryImage(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { showAlert('حجم الصورة يجب ألا يتجاوز 5 ميجابايت.'); input.value = ''; return; }
            storyImageFile = file;
            const preview = document.getElementById('storyImagePreview');
            const img = document.getElementById('storyImagePreviewImg');
            preview.classList.add('active');
            const reader = new FileReader();
            reader.onload = function(e) { img.src = e.target.result; };
            reader.readAsDataURL(file);
        }
        function removeStoryImage() {
            storyImageFile = null;
            document.getElementById('storyImageInput').value = '';
            document.getElementById('storyImagePreview').classList.remove('active');
            document.getElementById('storyImagePreviewImg').src = '';
        }
        function showStoryProgress() {
            const modal = document.getElementById('storyProgressModal');
            modal.classList.add('active');
            document.getElementById('storyProgressFill').style.width = '0%';
            document.getElementById('storyProgressText').textContent = '0%';
        }
        function updateStoryProgress(percent) {
            document.getElementById('storyProgressFill').style.width = percent + '%';
            document.getElementById('storyProgressText').textContent = Math.round(percent) + '%';
        }
        function hideStoryProgress() { document.getElementById('storyProgressModal').classList.remove('active'); }
        async function publishStory() {
            const text = document.getElementById('storyTextInput').value.trim();
            if (!text && !storyImageFile) { showAlert('يرجى إضافة نص أو صورة للستوري.'); return; }
            closeStoryCreateModal();
            showStoryProgress();
            try {
                let imageUrl = null;
                let progress = 0;
                if (storyImageFile) {
                    const progressInterval = setInterval(() => { progress += Math.random() * 15; if (progress < 90) updateStoryProgress(progress); }, 200);
                    const formData = new FormData();
                    formData.append('file', storyImageFile);
                    formData.append('upload_preset', UPLOAD_PRESET);
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
                    const data = await res.json();
                    clearInterval(progressInterval);
                    if (!data.secure_url) throw new Error('فشل رفع الصورة');
                    imageUrl = data.secure_url;
                    updateStoryProgress(100);
                } else {
                    for (let i = 0; i <= 100; i += 20) { updateStoryProgress(i); await new Promise(resolve => setTimeout(resolve, 100)); }
                }
                const { db, collection, addDoc } = window.ZephyrApp;
                const expiresAtDate = new Date(Date.now() + 24 * 60 * 60 * 1000);
                await addDoc(collection(db, "stories"), {
                    userId: currentUser.uid, imageUrl: imageUrl, caption: text || '',
                    createdAt: new Date().toISOString(), expiresAt: expiresAtDate.toISOString()
                });
                updateStoryProgress(100);
                setTimeout(() => { hideStoryProgress(); showAlert('✅ تم نشر الستوري بنجاح!', true); fetchStories(); }, 500);
            } catch (err) {
                console.error("خطأ نشر الستوري:", err);
                hideStoryProgress();
                showAlert('حدث خطأ أثناء النشر.');
            }
        }

        function openStoryViewerForUser(uid) {
            const allUidsWithStories = Object.keys(groupedStories).filter(id => groupedStories[id] && groupedStories[id].length > 0);
            activeStoryUserIds = [uid, ...allUidsWithStories.filter(id => id !== uid)];
            currentStoryUserIndex = 0;
            currentStoryItemIndex = 0;
            document.getElementById('storyViewerModal').classList.add('active');
            playCurrentStory();
        }
        function closeStoryViewer() {
            document.getElementById('storyViewerModal').classList.remove('active');
            if (storyTimer) { clearTimeout(storyTimer); storyTimer = null; }
        }
        async function playCurrentStory() {
            if (storyTimer) { clearTimeout(storyTimer); storyTimer = null; }
            const uid = activeStoryUserIds[currentStoryUserIndex];
            const userStories = groupedStories[uid];
            if (!userStories || userStories.length === 0 || currentStoryItemIndex >= userStories.length) {
                currentStoryUserIndex++;
                currentStoryItemIndex = 0;
                if (currentStoryUserIndex >= activeStoryUserIds.length) { closeStoryViewer(); return; }
                playCurrentStory();
                return;
            }
            const story = userStories[currentStoryItemIndex];
            const progressContainer = document.getElementById('storyProgressContainer');
            let progressHtml = '';
            for (let i = 0; i < userStories.length; i++) {
                let widthStyle = '0%';
                if (i < currentStoryItemIndex) widthStyle = '100%';
                progressHtml += `<div class="story-progress-segment"><div class="story-progress-fill" id="segment-fill-${i}" style="width: ${widthStyle};"></div></div>`;
            }
            progressContainer.innerHTML = progressHtml;
            const imgElement = document.getElementById('viewerImage');
            const captionEl = document.getElementById('viewerCaption');
            if (story.imageUrl) { imgElement.src = story.imageUrl; imgElement.style.display = 'block'; }
            else { imgElement.style.display = 'none'; }
            if (story.caption && story.caption.trim() !== '') { captionEl.textContent = sanitize(story.caption); captionEl.style.display = 'block'; }
            else { captionEl.style.display = 'none'; }
            const viewerTimeEl = document.getElementById('viewerTime');
            if (viewerTimeEl) viewerTimeEl.textContent = formatTimeAgo(new Date(story.createdAt));
            let name = "جيمر";
            let initial = "G";
            if (uid === currentUser.uid) { name = currentUser.displayName || "أنت"; initial = name.charAt(0).toUpperCase(); }
            else {
                try {
                    const { db, doc, getDoc } = window.ZephyrApp;
                    const userDoc = await getDoc(doc(db, "users", uid));
                    if (userDoc.exists()) { name = userDoc.data().displayName || "جيمر"; initial = name.charAt(0).toUpperCase(); }
                } catch(e) {}
            }
            document.getElementById('viewerUsername').textContent = sanitize(name);
            document.getElementById('viewerAvatar').textContent = sanitize(initial);
            const duration = 5000;
            const startTime = Date.now();
            const fillElement = document.getElementById(`segment-fill-${currentStoryItemIndex}`);
            function updateProgress() {
                const elapsed = Date.now() - startTime;
                const pct = Math.min((elapsed / duration) * 100, 100);
                if (fillElement) fillElement.style.width = pct + '%';
                if (pct < 100) { storyTimer = setTimeout(updateProgress, 50); }
                else { currentStoryItemIndex++; playCurrentStory(); }
            }
            storyTimer = setTimeout(updateProgress, 50);
        }
        function nextStorySegment() {
            if (storyTimer) clearTimeout(storyTimer);
            currentStoryItemIndex++;
            const uid = activeStoryUserIds[currentStoryUserIndex];
            if (groupedStories[uid] && currentStoryItemIndex >= groupedStories[uid].length) { currentStoryUserIndex++; currentStoryItemIndex = 0; }
            if (currentStoryUserIndex >= activeStoryUserIds.length) { closeStoryViewer(); return; }
            playCurrentStory();
        }
        function previousStorySegment() {
            if (storyTimer) clearTimeout(storyTimer);
            if (currentStoryItemIndex > 0) { currentStoryItemIndex--; }
            else if (currentStoryUserIndex > 0) {
                currentStoryUserIndex--;
                const uid = activeStoryUserIds[currentStoryUserIndex];
                currentStoryItemIndex = (groupedStories[uid] ? groupedStories[uid].length : 1) - 1;
            }
            playCurrentStory();
        }

        // ====== نظام المنشورات (مع تحديث الإعجابات) ======
        const POSTS_LIMIT = 5;

            try {
                const { db, collection, query, orderBy, limit, onSnapshot } = window.ZephyrApp;
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(POSTS_LIMIT));
                unsubscribePosts = onSnapshot(q, (snapshot) => {
                    const docs = snapshot.docs;
                    if (docs.length > 0) lastDoc = docs[docs.length - 1];
                    hasMore = docs.length === POSTS_LIMIT;
                    document.getElementById('loadMoreBtn').style.display = hasMore ? 'block' : 'none';

        async function loadMorePosts() {
            if (isFetching || !hasMore || !lastDoc) return;
            isFetching = true;
            const btn = document.getElementById('loadMoreBtn');
            btn.textContent = 'جاري التحميل...';
            btn.disabled = true;
            try {
                const { db, collection, query, orderBy, limit, startAfter, getDocs } = window.ZephyrApp;
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), startAfter(lastDoc), limit(POSTS_LIMIT));
                const snapshot = await getDocs(q);
                if (snapshot.empty) { hasMore = false; btn.style.display = 'none'; return; }
                const docs = snapshot.docs;
                lastDoc = docs[docs.length - 1];
                hasMore = docs.length === POSTS_LIMIT;
                const container = document.getElementById('feedContainer');
                let postsHTML = '';
                docs.forEach((docSnap) => { postsHTML += renderPostCard(docSnap); });
                container.insertAdjacentHTML('beforeend', postsHTML);
                btn.style.display = hasMore ? 'block' : 'none';
            } catch (err) {
                console.error('خطأ:', err);
                showAlert('حدث خطأ أثناء تحميل المزيد.');
            } finally {
                isFetching = false;
                btn.textContent = 'تحميل المزيد';
                btn.disabled = false;
            }
        }

        function formatTimeAgo(date) {
            if (!(date instanceof Date) || isNaN(date)) return 'الآن';
            const now = new Date();
            const diffMs = now - date;
            if (diffMs < 0) return 'في المستقبل';
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            const diffWeeks = Math.floor(diffDays / 7);
            if (diffMins < 1) return 'الآن';
            if (diffMins < 60) return 'منذ ' + diffMins + ' دقيقة';
            if (diffHours < 24) return 'منذ ' + diffHours + ' ساعة';
            if (diffDays < 7) return 'منذ ' + diffDays + ' يوم';
            return 'منذ ' + diffWeeks + ' أسبوع';
        }

        // ====== الإعجاب مع تحديث totalLikes ======
        async function toggleLikePost(postId) {
            if (!currentUser) { showAlert('يجب تسجيل الدخول للإعجاب.'); return; }
            const postCard = document.querySelector(`.post-card[data-post-id="${postId}"]`);
            if (!postCard) return;
            const likeBtn = postCard.querySelector('.action-btn:first-child');
            const likeSpan = postCard.querySelector(`#likeCount-${postId}`);
            if (!likeBtn || !likeSpan) return;
            const isLiked = likeBtn.classList.contains('liked');
            let currentLikes = parseInt(likeSpan.textContent, 10) || 0;
            if (isLiked) { likeBtn.classList.remove('liked'); currentLikes = Math.max(0, currentLikes - 1); }
            else { likeBtn.classList.add('liked'); currentLikes += 1; }
            likeSpan.textContent = currentLikes;
            try {
                const { db, doc, updateDoc, arrayUnion, arrayRemove, increment } = window.ZephyrApp;
                const postRef = doc(db, "posts", postId);
                const postSnap = await getDoc(postRef);
                if (!postSnap.exists()) throw new Error('المنشور غير موجود');
                const postData = postSnap.data();
                const authorUid = postData.userId;
                // تحديث الإعجابات في المنشور
                if (isLiked) {
                    await updateDoc(postRef, { likedBy: arrayRemove(currentUser.uid) });
                    if (authorUid) {
                        // إنقاص totalLikes لصاحب المنشور
                        const userRef = doc(db, "users", authorUid);
                        await updateDoc(userRef, { totalLikes: increment(-1) });
                    }
                } else {
                    await updateDoc(postRef, { likedBy: arrayUnion(currentUser.uid) });
                    if (authorUid) {
                        const userRef = doc(db, "users", authorUid);
                        await updateDoc(userRef, { totalLikes: increment(1) });
                    }
                }
            } catch (err) {
                console.error('خطأ:', err);
                if (isLiked) { likeBtn.classList.add('liked'); likeSpan.textContent = currentLikes + 1; }
                else { likeBtn.classList.remove('liked'); likeSpan.textContent = Math.max(0, currentLikes - 1); }
                showAlert('تعذر تحديث الإعجابات.');
            }
        }

        function handleDoubleTapLike(postId, containerEl) {
            const heart = document.getElementById(`dblHeart-${postId}`);
            if (heart) {
                heart.classList.remove('burst');
                void heart.offsetWidth;
                heart.classList.add('burst');
            }
            const postCard = document.querySelector(`.post-card[data-post-id="${postId}"]`);
            const likeBtn = postCard ? postCard.querySelector('.action-btn:first-child') : null;
            if (likeBtn && !likeBtn.classList.contains('liked')) toggleLikePost(postId);
        }

            imageFile = file;

        function removePostImage() {

            document.getElementById('postImageInput').value = '';

        async function uploadImageToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            if (!data.secure_url) throw new Error(data.error?.message || 'فشل رفع الصورة');
            return data.secure_url;
        }
        async function submitPost() {
            if (isPublishing) return;
            hideAlert();
            const textarea = document.getElementById('postContent');
            let contentRaw = textarea.value.trim();
            if (contentRaw.replace(/\s/g, '').length < 3 && !imageFile) { showAlert('يرجى كتابة محتوى أو إضافة صورة.'); return; }
            if (!currentUser) { showAlert('يجب عليك تسجيل الدخول للنشر.'); return; }
            const btn = document.getElementById('publishBtn');
            const cancelBtn = document.getElementById('cancelPublishBtn');
            const progressContainer = document.getElementById('uploadProgressContainer');
            const progressFill = document.getElementById('uploadProgressFill');
            const progressText = document.getElementById('uploadProgressText');
            btn.disabled = true;
            cancelBtn.style.display = 'block';
            isPublishing = true;
            try {
                let imageUrl = null;
                if (imageFile) {
                    btn.textContent = 'رفع الصورة...';
                    progressContainer.classList.add('active');
                    progressFill.style.width = '30%';
                    progressText.textContent = '30% - جاري رفع الصورة...';
                    imageUrl = await uploadImageToCloudinary(imageFile);
                    progressFill.style.width = '100%';
                    progressText.textContent = '100% - تم رفع الصورة';
                    progressContainer.classList.remove('active');
                }
                btn.textContent = 'حفظ البيانات...';
                const { db, collection, addDoc, serverTimestamp } = window.ZephyrApp;
                const authorName = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : null) || 'Gamer';
                await addDoc(collection(db, "posts"), {
                    author: sanitize(authorName), userId: currentUser.uid, content: sanitize(contentRaw),
                    imageUrl: imageUrl || null, likedBy: [], likes: 0, commentsCount: 0, createdAt: serverTimestamp()
                });
                textarea.value = '';
                removePostImage();
                cancelBtn.style.display = 'none';
                showAlert('✅ تم نشر المنشور بنجاح!', true);
            } catch (err) {
                console.error('خطأ:', err);
                let errorMsg = 'تعذر نشر المشاركة.';
                if (err.message) errorMsg = err.message;
                showAlert(errorMsg);
                btn.textContent = 'إعادة المحاولة';
                btn.disabled = false;
                cancelBtn.style.display = 'none';
            } finally { isPublishing = false; }
        }
        function cancelPublish() {
            document.getElementById('uploadProgressContainer').classList.remove('active');
            document.getElementById('publishBtn').textContent = 'نشر الآن';
            document.getElementById('publishBtn').disabled = false;
            document.getElementById('cancelPublishBtn').style.display = 'none';
            isPublishing = false;
            showAlert('تم إلغاء النشر.');
        }

        // ====== التعليقات ======
        function openCommentsModal(postId) {
            activePostId = postId;
            document.getElementById('commentsModal').classList.add('show');
            document.getElementById('commentInput').value = '';
            document.getElementById('commentInput').focus();
            subscribeToComments(postId);
        }
        function closeCommentsModal() {
            document.getElementById('commentsModal').classList.remove('show');
            if (unsubscribeComments) { unsubscribeComments(); unsubscribeComments = null; }
            activePostId = null;
        }
        function subscribeToComments(postId) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">جاري تحميل التعليقات...</div>';
            if (unsubscribeComments) { unsubscribeComments(); unsubscribeComments = null; }
            try {
                const { db, collection, query, orderBy, onSnapshot } = window.ZephyrApp;
                const commentsRef = collection(db, "posts", postId, "comments");
                const q = query(commentsRef, orderBy("createdAt", "asc"));
                unsubscribeComments = onSnapshot(q, (snapshot) => {
                    if (snapshot.empty) {
                        list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">لا توجد تعليقات بعد. كن أول من يعلق! 💬</div>';
                        return;
                    }
                    let html = '';
                    snapshot.forEach((docSnap) => {
                        const comment = docSnap.data();
                        let timeStr = 'الآن';
                        if (comment.createdAt) {
                            let dateObj = comment.createdAt;
                            if (typeof dateObj.toDate === 'function') dateObj = dateObj.toDate();
                            else dateObj = new Date(dateObj);
                            timeStr = formatTimeAgo(dateObj);
                        }
                        html += `<div class="comment-item"><span class="comment-user">@${sanitize(comment.author || 'جيمر')}</span><span class="comment-text">${sanitize(comment.text || '')}</span><span class="comment-time">${sanitize(timeStr)}</span></div>`;
                    });
                    list.innerHTML = html;
                    list.scrollTop = list.scrollHeight;
                });
            } catch (err) {
                console.error("خطأ:", err);
                list.innerHTML = '<div style="text-align:center;color:var(--danger);padding:20px;">تعذر تحميل التعليقات.</div>';
            }
        }
        async function sendComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text || !activePostId || !currentUser) return;
            const btn = document.getElementById('sendCommentBtn');
            btn.disabled = true;
            try {
                const { db, collection, addDoc, serverTimestamp, doc, updateDoc } = window.ZephyrApp;
                const authorName = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : null) || 'Gamer';
                await addDoc(collection(db, "posts", activePostId, "comments"), {
                    author: sanitize(authorName), userId: currentUser.uid, text: sanitize(text), createdAt: serverTimestamp()
                });
                // زيادة عدد التعليقات
                const postRef = doc(db, "posts", activePostId);
                await updateDoc(postRef, { commentsCount: increment(1) });
                input.value = '';
            } catch (err) {
                console.error('خطأ:', err);
                showAlert('فشل إرسال التعليق.');
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        // ====== إخفاء الشريط السفلي ======
        let lastScrollY = 0;
        window.addEventListener('scroll', () => {
            const bottomNav = document.getElementById('bottomNav');
            if (!bottomNav) return;
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 50) bottomNav.classList.add('hidden');
            else if (currentScrollY < lastScrollY || currentScrollY < 10) bottomNav.classList.remove('hidden');
            lastScrollY = currentScrollY;
        });

        // ====== التهيئة ======
        document.addEventListener('DOMContentLoaded', function() {
            const checkInterval = setInterval(() => {
                if (window.ZephyrApp && window.ZephyrApp.auth) {
                    clearInterval(checkInterval);
                    const { auth, onAuthStateChanged } = window.ZephyrApp;
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            currentUser = user;
                            setupUserProfile(user);
                            await loadFollowing();
                            loadPosts();
                            fetchStories();
                        } else {
                            window.location.replace('login.html');
                        }
                    });
                }
            }, 100);
        });

        // ====== تصدير الدوال ======
        window.submitPost = submitPost;
        window.toggleLikePost = toggleLikePost;
        window.handleDoubleTapLike = handleDoubleTapLike;
        window.sharePost = sharePost;
        window.toggleSavePost = toggleSavePost;
        window.toggleFollow = toggleFollow;
        window.togglePostMenu = togglePostMenu;
        window.copyPostLink = copyPostLink;
        window.reportPost = reportPost;
        window.openDeleteModal = openDeleteModal;
        window.closeDeleteModal = closeDeleteModal;
        window.confirmDeletePost = confirmDeletePost;
        window.loadMorePosts = loadMorePosts;
        window.confirmSignOut = confirmSignOut;
        window.closeLogoutModal = closeLogoutModal;
        window.openCommentsModal = openCommentsModal;
        window.closeCommentsModal = closeCommentsModal;
        window.sendComment = sendComment;
        window.previewPostImage = previewPostImage;
        window.removePostImage = removePostImage;
        window.cancelPublish = cancelPublish;
        window.openStoryCreateModal = openStoryCreateModal;
        window.closeStoryCreateModal = closeStoryCreateModal;
        window.previewStoryImage = previewStoryImage;
        window.removeStoryImage = removeStoryImage;
        window.publishStory = publishStory;
        window.openStoryViewerForUser = openStoryViewerForUser;
        window.closeStoryViewer = closeStoryViewer;
        window.nextStorySegment = nextStorySegment;
        window.previousStorySegment = previousStorySegment;
        window.showStoryProgress = showStoryProgress;
        window.updateStoryProgress = updateStoryProgress;
        window.hideStoryProgress = hideStoryProgress;
        window.showNotifPlaceholder = showNotifPlaceholder;
    </script>
</body>
</html>
